<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lets learn form</title>
</head>
<body>
    <!-- "Which input field does this label belong to?" -->
     <!-- for="username" tells the browser which input is connected to this label.

        id="username" identifies the input field.

        Both values match, so the browser connects them. -->
        <form action="post"></form>
        <input type="text" name="username" placeholder="Enter your name">
        <div>
            <input type="radio" id="gender1" name="gender" value="Male">
            <label for="gender1">Male</label>
        </div>
        <div>
            <input type="radio" id="gender" name="gender" value="Female">
            <label for="gender">Female</label>
        </div>

    
</body>
</html>
