<!-- Meaning

<!DOCTYPE html>

Tells the browser to use modern HTML standards.

<html lang="en">

Starts the HTML document and specifies English as its language.

<head>

Contains information about the webpage.

<meta charset="UTF-8">

Allows the page to display a wide range of characters and symbols.

<meta name="viewport" ...>

Helps the page display correctly on mobile devices.

<title>Document</title>

Sets the title shown in the browser tab.

</head>

Ends the head section.

<body>

Starts the section containing visible webpage content.

</body>

Ends the body section.

</html>

Ends the HTML document. -->
